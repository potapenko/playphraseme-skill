name: Release skill

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make check
      - name: Upload skill.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/skill.zip --clobber
